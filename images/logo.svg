<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Petite Focus Studio">
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer refined ring -->
    <circle cx="100" cy="100" r="96" stroke-width="1"/>

    <!-- Cardinal accent dots -->
    <circle cx="100" cy="6" r="1.4" fill="currentColor"/>
    <circle cx="100" cy="194" r="1.4" fill="currentColor"/>
    <circle cx="6" cy="100" r="1.4" fill="currentColor"/>
    <circle cx="194" cy="100" r="1.4" fill="currentColor"/>

    <!-- Camera -->
    <g stroke-width="1.8">
      <!-- Flash / viewfinder -->
      <rect x="89" y="34" width="22" height="6" rx="1.5"/>
      <!-- Camera body -->
      <rect x="76" y="40" width="48" height="28" rx="2.5"/>
      <!-- Lens outer ring -->
      <circle cx="100" cy="54" r="9"/>
      <!-- Lens inner -->
      <circle cx="100" cy="54" r="4"/>
      <!-- Base plate -->
      <line x1="82" y1="71" x2="118" y2="71"/>
      <!-- Tripod legs -->
      <line x1="88" y1="73" x2="82" y2="86"/>
      <line x1="100" y1="73" x2="100" y2="86"/>
      <line x1="112" y1="73" x2="118" y2="86"/>
    </g>
  </g>

  <!-- Wordmark: Petite Focus (italic serif) -->
  <text x="100" y="122"
        text-anchor="middle"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
        font-style="italic"
        font-weight="500"
        font-size="28"
        fill="currentColor">Petite Focus</text>

  <!-- Divider -->
  <line x1="78" y1="135" x2="122" y2="135" stroke="currentColor" stroke-width="0.8"/>

  <!-- STUDIO (spaced sans) -->
  <text x="100" y="154"
        text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-weight="500"
        font-size="11"
        letter-spacing="3.5"
        fill="currentColor">STUDIO</text>
</svg>
