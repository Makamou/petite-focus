<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Petite Focus Studio</title>
    <meta
      name="description"
      content="Contact Petite Focus Studio — let's collaborate on portraits, family sessions, or events."
    />
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/footer.css" />
    <link rel="stylesheet" href="./styles/contact.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="header-container">
        <a href="index.html" class="header-left" aria-label="Petite Focus Studio — Home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Petite Focus Studio">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="100" cy="100" r="96" stroke-width="1"/>
              <circle cx="100" cy="6" r="1.4" fill="currentColor"/>
              <circle cx="100" cy="194" r="1.4" fill="currentColor"/>
              <circle cx="6" cy="100" r="1.4" fill="currentColor"/>
              <circle cx="194" cy="100" r="1.4" fill="currentColor"/>
              <g stroke-width="1.8">
                <rect x="89" y="34" width="22" height="6" rx="1.5"/>
                <rect x="76" y="40" width="48" height="28" rx="2.5"/>
                <circle cx="100" cy="54" r="9"/>
                <circle cx="100" cy="54" r="4"/>
                <line x1="82" y1="71" x2="118" y2="71"/>
                <line x1="88" y1="73" x2="82" y2="86"/>
                <line x1="100" y1="73" x2="100" y2="86"/>
                <line x1="112" y1="73" x2="118" y2="86"/>
              </g>
            </g>
            <text x="100" y="122" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-style="italic" font-weight="500" font-size="28" fill="currentColor">Petite Focus</text>
            <line x1="78" y1="135" x2="122" y2="135" stroke="currentColor" stroke-width="0.8"/>
            <text x="100" y="154" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="11" letter-spacing="3.5" fill="currentColor">STUDIO</text>
          </svg>
        </a>
        <nav class="header-right" aria-label="Primary">
          <button onclick="location.href='index.html'">Home</button>
          <button onclick="location.href='aboutUs.html'">About</button>
          <button onclick="location.href='gallery.html'">Gallery</button>
          <button class="is-active" onclick="location.href='contactUs.html'">Contact</button>
        </nav>
      </header>

      <main class="contact-section body-content">
        <form class="contact-form" onsubmit="handleSubmit(event)">
          <span class="eyebrow">Let&rsquo;s Talk</span>
          <h2>Get in Touch</h2>
          <p>
            Tell me a little about your project, your story, or the moment
            you&rsquo;d like to capture. You can also reach me directly at
            <a href="mailto:amkristian91@yahoo.com" class="email-link"
              >amkristian91@yahoo.com</a
            >.
          </p>

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your project" required></textarea>
          </div>

          <div class="form-actions">
            <button type="submit">Send Message</button>
          </div>
        </form>
      </main>

      <footer class="footer">
        <div class="footer-container">
          <div class="footer-logo">
            © 2025 <span class="footer-logo-sub">Petite Focus Studio</span>
          </div>
          <nav class="footer-links" aria-label="Footer">
            <a href="./aboutUs.html">About</a>
            <a href="./gallery.html">Gallery</a>
            <a href="./contactUs.html">Contact</a>
          </nav>
          <div class="footer-socials">
            <a href="https://github.com/Makamou" target="_blank" rel="noopener">Github</a>
            <a href="https://www.linkedin.com/in/moubarak-akamou" target="_blank" rel="noopener">LinkedIn</a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      function handleSubmit(e) {
        e.preventDefault();
        const button = e.target.querySelector('button[type="submit"]');
        const original = button.textContent;
        button.textContent = "Message Sent";
        button.disabled = true;
        setTimeout(() => {
          button.textContent = original;
          button.disabled = false;
          e.target.reset();
        }, 2400);
      }
    </script>
  </body>
</html>
